name: Deploy Flutter App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ======================================================
  # JOB 1: ANDROID BUILD & DEPLOY TO FIREBASE
  # ======================================================
  deploy_android:
    name: Build & Deploy Android (Dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
          echo -e "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

      - name: Build APK (Dev Flavor)
        run: flutter build apk --release --flavor dev -t lib/main_dev.dart

      - name: Create Firebase Service Credentials file
        run: echo '${{ secrets.CREDENTIAL_FILE_CONTENT }}' > firebase-service-account.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-dev-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID_ANDROID }}" \
            --release-notes "Automated build"
            --groups "testers"

